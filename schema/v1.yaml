# EntityGraph-RAG entity/relation schema — v1
#
# This is the fixed vocabulary the extraction pipeline (Phase 2) is
# constrained to. The LLM extraction prompt is built from this file, and the
# Pydantic Triple model's Literal types are generated from it, so labels are
# never invented ad hoc at extraction time — that's what makes extraction
# quality evaluable later (Phase 6).
#
# Retargeting to a new domain (legal contracts, supply-chain docs, etc.)
# means writing a new version of this file, not changing the pipeline code.

version: 1

node_types:
  Company:
    description: >
      A business entity, public or private (e.g. NVIDIA, TSMC). The primary
      node type — most edges either originate or terminate on a Company.
    properties:
      - name        # canonical display name, post entity-resolution
      - ticker       # optional, exchange ticker symbol
      - cik          # optional, SEC EDGAR Central Index Key
      - sector       # optional, coarse sector label

  Person:
    description: >
      An individual associated with one or more companies — executive,
      board member, named auditor contact, etc.
    properties:
      - name

  Product:
    description: A named product or product line (e.g. "H100 GPU", "iPhone").
    properties:
      - name

  Location:
    description: A geographic location (country, region, facility) referenced in a filing.
    properties:
      - name

  RiskFactor:
    description: >
      A named/categorized risk disclosed in a filing's "Risk Factors"
      section (e.g. "supply chain concentration", "foreign currency exposure").
    properties:
      - name
      - category   # optional coarse bucket, e.g. "supply_chain", "regulatory"

  Auditor:
    description: An accounting/auditing firm.
    properties:
      - name

edge_types:
  SUPPLIES:
    subject: Company
    object: Company
    description: Subject company supplies goods, components, or services to object company.

  COMPETES_WITH:
    subject: Company
    object: Company
    symmetric: true
    description: Subject and object company are named as competitors of each other.

  SUBSIDIARY_OF:
    subject: Company
    object: Company
    description: Subject company is a subsidiary of object company.

  EXECUTIVE_OF:
    subject: Person
    object: Company
    description: Subject person holds or held an executive/board role at object company.

  INVESTED_IN:
    subject: Company
    object: Company
    description: Subject company holds or made an investment in object company.

  AUDITED_BY:
    subject: Company
    object: Auditor
    description: Subject company's financials are audited by object auditor.

  DISCLOSED_RISK:
    subject: Company
    object: RiskFactor
    description: Subject company disclosed object risk factor in a filing.

  MENTIONS:
    subject: Company
    object: [Company, Person, Product, Location]
    description: >
      Weak, untyped co-occurrence edge for entity pairs that don't fit a
      more specific relation above. Lowest-confidence edge type — used as a
      fallback so extraction isn't forced into a wrong typed relation.

# Properties every edge instance carries, regardless of type — this is what
# gives every graph edge full provenance back to source text (Phase 3).
edge_properties:
  - source_chunk_id
  - source_doc_id
  - confidence
  - extracted_at
