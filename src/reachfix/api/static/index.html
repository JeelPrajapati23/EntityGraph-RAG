<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reachfix</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e1dc;
    --accent: #2f5fd0; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a94; --border: #34332f;
            --accent: #7ea2ff; --warn: #e0a24a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px;
         height: calc(100vh - 66px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #graph { height: 420px; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
            display: flex; flex-direction: column; min-height: 0; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
          background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
           font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #output { overflow-y: auto; margin-top: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--accent);
           color: var(--accent); font-size: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { color: var(--warn); font-size: 13px; }
  .answer { white-space: pre-wrap; margin: 10px 0; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  ul { padding-left: 18px; margin: 0; }
  li { margin-bottom: 8px; }
  code { font-size: 13px; }
  #graph { flex: 1; min-height: 300px; margin-top: 12px; border: 1px solid var(--border); border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>reachfix</h1>
  <p>Hybrid vector + graph retrieval over SEC filings and earnings calls. Every answer cites its chunks and graph paths.</p>
</header>
<main>
  <section>
    <form id="ask">
      <input id="q" placeholder="Ask a question, e.g. what risks does NVIDIA disclose?" autocomplete="off">
      <button id="ask-btn">Ask</button>
    </form>
    <div id="output"><p class="muted">The graph panel shows the traversal behind relational and hybrid answers.</p></div>
  </section>
  <section>
    <form id="explore">
      <input id="entity" placeholder="Explore an entity, e.g. NVIDIA" autocomplete="off">
      <button id="explore-btn">Explore</button>
    </form>
    <div id="graph-caption" class="muted" style="margin-top:8px"></div>
    <div id="graph"></div>
  </section>
</main>
<script>
const TYPE_COLORS = { Company: "#2f5fd0", Person: "#1f8a5b", Product: "#b5621b", Location: "#7a4fc4",
                      RiskFactor: "#c0392b", Auditor: "#5c6770" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const textColor = () => getComputedStyle(document.documentElement).getPropertyValue("--text").trim();

const network = new vis.Network(document.getElementById("graph"), { nodes: [], edges: [] }, {
  physics: { stabilization: { iterations: 150 } },
  edges: { arrows: "to", font: { size: 10, align: "middle", strokeWidth: 0, color: textColor() },
           color: { color: "#9b9a94" }, smooth: { type: "dynamic" } },
  nodes: { shape: "dot", size: 14, font: { color: textColor() } },
});

function drawGraph(subgraph, caption, focusId) {
  document.getElementById("graph-caption").textContent = caption;
  network.setData({
    nodes: subgraph.nodes.map(n => ({
      id: n.entity_id, label: n.canonical_name, title: `${n.entity_type ?? "?"}: ${n.entity_id}`,
      color: TYPE_COLORS[n.entity_type] ?? "#888", size: n.entity_id === focusId ? 22 : 14,
    })),
    edges: subgraph.edges.map(e => ({
      from: e.source, to: e.target, label: e.relation,
      title: e.confidence != null ? `confidence ${e.confidence.toFixed(2)} · ${e.n_citations} citation(s)` : e.relation,
    })),
  });
}

async function call(url, options) {
  const resp = await fetch(url, options);
  const body = await resp.json();
  if (!resp.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
  return body;
}

document.getElementById("ask").addEventListener("submit", async ev => {
  ev.preventDefault();
  const query = document.getElementById("q").value.trim();
  if (!query) return;
  const out = document.getElementById("output"), btn = document.getElementById("ask-btn");
  btn.disabled = true;
  out.innerHTML = `<p class="muted">Routing and retrieving…</p>`;
  try {
    const r = await call("/query", { method: "POST", headers: { "Content-Type": "application/json" },
                                     body: JSON.stringify({ query }) });
    const paths = r.citations.graph_paths.map(p => `<li><code>${esc(p)}</code></li>`).join("");
    const chunks = r.citations.chunks.map((c, i) => `
      <li><strong>[chunk ${i + 1}]</strong> ${esc(c.ticker)} ${esc(c.form)} · ${esc(c.section)}
        · <a href="${esc(c.source_url)}" target="_blank" rel="noopener">source</a>
        <div class="muted">${esc(c.snippet)}…</div></li>`).join("");
    out.innerHTML = `
      <span class="badge">${esc(r.route)}</span>
      <div class="muted">${esc(r.classification_reasoning)}</div>
      ${r.warning ? `<div class="warn">${esc(r.warning)}</div>` : ""}
      <div class="answer">${esc(r.answer)}</div>
      ${paths ? `<h3>Graph paths</h3><ul>${paths}</ul>` : ""}
      ${chunks ? `<h3>Chunks</h3><ul>${chunks}</ul>` : ""}`;
    if (r.subgraph.nodes.length) drawGraph(r.subgraph, `Traversal behind this answer (${r.route})`);
  } catch (err) {
    out.innerHTML = `<p class="warn">${esc(err.message)}</p>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("explore").addEventListener("submit", async ev => {
  ev.preventDefault();
  const entity = document.getElementById("entity").value.trim();
  if (!entity) return;
  try {
    const r = await call(`/graph/explore?entity=${encodeURIComponent(entity)}&depth=2`);
    drawGraph(r, `Neighborhood of ${r.entity_id} (2 hops)`, r.entity_id);
  } catch (err) {
    document.getElementById("graph-caption").textContent = err.message;
  }
});
</script>
</body>
</html>
