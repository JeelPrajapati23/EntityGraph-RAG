[project]
name = "reachfix"
version = "0.1.0"
description = "Graph-guided hybrid retrieval over npm dependency trees and security advisories: which projects a vulnerability reaches, and the smallest upgrade that fixes it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "huggingface-hub>=1.32.0",
    "mcp>=2.2.0",
    "networkx>=3.7",
    "node-semver>=0.9.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
reachfix = "reachfix:main"
reachfix-mcp = "reachfix.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
