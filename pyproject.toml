[project]
name = "entitygraph-rag"
version = "0.1.0"
description = "Hybrid retrieval engine combining vector search with graph traversal for multi-hop QA over document collections"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.24.0",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[project.scripts]
entitygraph-rag = "entitygraph_rag:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
